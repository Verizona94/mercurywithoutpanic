<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Меркурий без паники</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #22c55e;
      --muted: #94a3b8;
      --glass: rgba(255,255,255,0.03);
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #071024, #0c263d);
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #042029;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.2);
      color: #f1f5f9;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #012023;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #16a34a; }
    .demo {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .demo ul { margin: 8px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="mark">М</div>
      <div><strong>Меркурий без паники</strong></div>
    </div>

    <h1>Войдите в личный кабинет</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email или логин</label>
        <input type="text" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Войти</button>
    </form>

    <div class="demo">
      <p>Демо-данные для теста:</p>
      <ul>
        <li><strong>Админ:</strong> <code>admin</code> / <code>admin</code></li>
        <li><strong>Ученик:</strong> <code>user</code> / <code>user</code></li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
