<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Меркурий без паники</title>
  <style>
    body{font-family:sans-serif;background:#071024;color:#e6eef8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .card{background:#0b1220;padding:24px;border-radius:14px;max-width:400px;width:100%;box-shadow:0 6px 24px rgba(2,6,23,0.6)}
    input{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:none;background:#0f1724;color:#e6eef8}
    button{width:100%;padding:10px;background:#22c55e;color:#012023;border:none;border-radius:10px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h2>Вход в кабинет</h2>
    <form id="loginForm">
      <input type="text" id="login" placeholder="user или admin" required>
      <input type="password" id="password" placeholder="Пароль (тот же, что логин)" required>
      <button type="submit">Войти</button>
    </form>
    <p style="font-size:12px;color:#94a3b8;margin-top:8px">
      Демо: user/user или admin/admin
    </p>
  </div>

  <script>
    const DEMO_USERS = {
      user: {name:'Анна Петрова', role:'user', avatar:'А', subscription:{plan:'Про', status:'active', expires:'15.02.2026'}, lessons:[{title:'Регистрация',completed:true},{title:'Добавление сотрудников',completed:true},{title:'Виды ВСД',completed:false} ]},
      admin: {name:'Админ', role:'admin', avatar:'А'}
    };

    document.getElementById('loginForm').addEventListener('submit', e=>{
      e.preventDefault();
      const login = e.target.login.value.trim().toLowerCase();
      const pwd = e.target.password.value;
      if(DEMO_USERS[login] && pwd===login){
        localStorage.setItem('currentUser', JSON.stringify(DEMO_USERS[login]));
        window.location.href='cabinet.html';
      } else {
        alert('Неверный логин/пароль. Попробуйте: user/user или admin/admin');
      }
    });
  </script>
</body>
</html>
