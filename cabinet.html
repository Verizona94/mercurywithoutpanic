<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабинет — Меркурий без паники</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #22c55e;
      --muted: #94a3b8;
      --glass: rgba(255,255,255,0.03);
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui;
      background: linear-gradient(180deg, #071024 0%, #071229 100%);
      color: #e6eef8;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo .mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #042029;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #012023;
      flex-shrink: 0;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(2,6,23,0.6);
    }
    .section { margin-bottom: 32px; }
    h1, h2 { font-size: 24px; margin: 0 0 16px; color: #f1f5f9; }
    h3 { font-size: 18px; margin: 0 0 12px; }
    .module-item, .lesson-item {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.02);
    }
    .lesson-item.completed::before {
      content: "✓";
      color: var(--accent);
      margin-right: 10px;
      font-weight: bold;
    }
    .lesson-item::before {
      content: "○";
      margin-right: 10px;
      color: var(--muted);
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge.active { background: rgba(34,197,94,0.2); color: var(--accent); }
    .badge.expired { background: rgba(239,68,68,0.2); color: var(--danger); }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .table th, .table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .table th {
      color: var(--muted);
      font-weight: 600;
    }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.active { background: rgba(34,197,94,0.15); color: var(--accent); }
    .status.trial { background: rgba(245,158,11,0.15); color: var(--warning); }
    .status.expired { background: rgba(239,68,68,0.15); color: var(--danger); }
    .btn {
      background: var(--accent);
      color: #012023;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
    }
    .btn-outline:hover { color: #cbd5e1; border-color: var(--accent); }

    #login-screen, #cabinet-screen { display: none; }
    .visible { display: block !important; }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      header { flex-direction: column; gap: 16px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="login-screen" class="visible">
    <div class="container">
      <div class="card" style="max-width:420px;margin:80px auto">
        <div class="logo">
          <div class="mark">М</div>
          <div><strong>Меркурий без паники</strong></div>
        </div>
        <h1>Вход в кабинет</h1>
        <form id="loginForm">
          <div style="margin-bottom:16px">
            <label style="display:block;margin-bottom:6px;color:#cbd5e1">Логин</label>
            <input type="text" id="email" name="email" autocomplete="username" style="width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);color:#f1f5f9" required>
          </div>
          <div style="margin-bottom:16px">
            <label style="display:block;margin-bottom:6px;color:#cbd5e1">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" style="width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);color:#f1f5f9" required>
          </div>
          <button type="submit" class="btn" style="width:100%">Войти</button>
          <div style="font-size:13px;color:var(--muted);margin-top:16px">
            Демо: <code>admin / admin</code> или <code>user / user</code>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="cabinet-screen">
    <!-- Content will be injected by JS -->
  </div>
