<script>
const DEMO_USERS = {
  user: {
    name:'Анна Петрова',
    avatar:'А',
    role:'user',
    subscription:{plan:'Про', status:'active', expires:'15.02.2026'},
    lessons:[
      {title:'Регистрация организации', completed:true},
      {title:'Добавление сотрудников', completed:true},
      {title:'Настройка прав доступа', completed:true},
      {title:'Виды ВСД', completed:false},
      {title:'Оформление ВСД на ТН', completed:false},
      {title:'Гашение ВСД', completed:false},
      {title:'Типовые ошибки', completed:false}
    ]
  },
  admin: {
    name:'Админ',
    avatar:'А',
    role:'admin',
    students:[
      {name:'Анна Петрова', plan:'Про', status:'active', progress:'43%'},
      {name:'Иван Сидоров', plan:'Стандарт', status:'trial', progress:'15%'},
      {name:'ООО Агрохим', plan:'Про', status:'expired', progress:'89%'}
    ]
  }
};

const loginScreen = document.getElementById('login-screen');
const cabinetScreen = document.getElementById('cabinet-screen');
const loginForm = document.getElementById('loginForm');

const currentUser = JSON.parse(localStorage.getItem('currentUser'));
if(currentUser) showCabinet(currentUser);

if(loginForm){
  loginForm.addEventListener('submit', e=>{
    e.preventDefault();
    const login=e.target.login.value.trim().toLowerCase();
    const pwd=e.target.password.value;
    if(DEMO_USERS[login] && pwd===login){
      const user=DEMO_USERS[login];
      localStorage.setItem('currentUser', JSON.stringify(user));
      showCabinet(user);
    } else { alert('Неверный логин/пароль. Попробуйте: user/user или admin/admin'); }
  });
}

function showCabinet(user){
  loginScreen.classList.remove('visible');
  cabinetScreen.classList.add('visible');

  let html = `<div class="container">
    <header>
      <div class="logo"><div class="mark">М</div><strong>Меркурий без паники</strong></div>
      <div class="user-info">
        <div class="avatar">${user.avatar}</div>
        <div><div>${user.name}</div><div style="font-size:13px;color:var(--muted)">${user.role==='admin'?'Администратор':'Ученик'}</div></div>
        <a href="#" id="logout" style="margin-left:16px;color:var(--muted);text-decoration:underline">Выйти</a>
      </div>
    </header>`;

  if(user.role==='admin'){
    html += `<h2>Панель администратора</h2>
      <div class="card"><p>Всего учеников: <strong>${user.students.length}</strong></p></div>
      <h3>Ученики</h3>
      <div class="card"><table>
        <thead><tr><th>Имя</th><th>Тариф</th><th>Статус</th><th>Прогресс</th></tr></thead>
        <tbody>${user.students.map(s=>`<tr><td>${s.name}</td><td>${s.plan}</td><td><span class="badge ${s.status}">${s.status}</span></td><td>${s.progress}</td></tr>`).join('')}</tbody>
      </table></div>`;
  } else {
    const completed=user.lessons.filter(l=>l.completed).length;
    const total=user.lessons.length;
    const percent=Math.round(completed/total*100);
    html += `<h2>Добро пожаловать, ${user.name}!</h2>
      <div class="card">
        <div><strong>Подписка:</strong> ${user.subscription.plan}</div>
        <div style="margin:8px 0"><span class="badge ${user.subscription.status}">${user.subscription.status==='active'?'Активна':'Истекла'}</span> до ${user.subscription.expires}</div>
        <div>Прогресс: ${completed}/${total} уроков</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
      </div>
      <h3>Уроки</h3>
      <div class="card">${user.lessons.map(l=>`<div class="lesson-item ${l.completed?'completed':''}">${l.title}</div>`).join('')}
        <button class="btn" onclick="completeNext()">✅ Пройти следующий урок</button>
      </div>
      <h3>Материалы</h3>
      <div class="card">
        <a href="#" class="btn">📥 Чек-листы (PDF)</a>
        <a href="#" class="btn">📊 Шаблоны ВСД (Excel)</a>
        <a href="#" class="btn btn-outline">💬 Чат поддержки</a>
      </div>`;
  }

  html += `</div>`;
  cabinetScreen.innerHTML = html;

  document.getElementById('logout').onclick = e=>{
    e.preventDefault();
    localStorage.removeItem('currentUser');
    cabinetScreen.classList.remove('visible');
    loginScreen.classList.add('visible');
  };
}

function completeNext(){
  let user = JSON.parse(localStorage.getItem('currentUser'));
  if(!user || user.role!=='user') return;
  const next = user.lessons.find(l=>!l.completed);
  if(next){ next.completed=true; localStorage.setItem('currentUser', JSON.stringify(user)); showCabinet(user); }
  else alert('Все уроки пройдены! 🎉');
}
</script>
