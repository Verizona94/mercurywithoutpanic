<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабинет — Меркурий без паники</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #22c55e;
      --muted: #94a3b8;
      --glass: rgba(255,255,255,0.03);
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter',sans-serif; background:linear-gradient(180deg,#071024 0%,#071229 100%); color:#e6eef8; line-height:1.5; }
    .container { max-width:1100px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.03); margin-bottom:32px; }
    .logo { display:flex; align-items:center; gap:12px; }
    .mark { width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#06b6d4); display:flex; align-items:center; justify-content:center; font-weight:800; color:#012023; }
    .user-info { display:flex; align-items:center; gap:12px; }
    .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:600; color:#012023; }
    .card { background:var(--card); padding:20px; border-radius:14px; box-shadow:0 6px 24px rgba(2,6,23,0.6); margin-bottom:24px; }
    h1,h2 { font-size:24px; margin:0 0 20px; color:#f1f5f9; }
    h3 { font-size:18px; margin:0 0 12px; }
    .progress-bar { height:6px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; margin:8px 0; }
    .progress-fill { height:100%; background:var(--accent); border-radius:3px; }
    .lesson-item { padding:12px 16px; border-radius:10px; margin-bottom:8px; background:var(--glass); border:1px solid rgba(255,255,255,0.02); display:flex; justify-content:space-between; align-items:center; }
    .lesson-item.completed { opacity:0.7; }
    .btn { background:var(--accent); color:#012023; border:none; padding:6px 12px; border-radius:8px; font-weight:600; cursor:pointer; }
    .btn-outline { background:transparent; border:1px solid rgba(255,255,255,0.06); color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.05); }
    .status.active { color: var(--accent); }
    .status.trial { color: var(--warning); }
    .status.expired { color: var(--danger); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="container">
    <div class="card" style="max-width:400px;margin:60px auto">
      <div class="logo">
        <div class="mark">М</div>
        <strong>Меркурий без паники</strong>
      </div>
      <h2>Вход в кабинет</h2>
      <form id="loginForm">
        <div style="margin-bottom:16px">
          <label>Email</label>
          <input type="text" id="email" required style="width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);color:#f1f5f9">
        </div>
        <div style="margin-bottom:16px">
          <label>Пароль</label>
          <input type="password" id="password" required style="width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);color:#f1f5f9">
        </div>
        <button type="submit" class="btn">Войти</button>
        <div style="font-size:13px;color:var(--muted);margin-top:12px">
          Демо: <code>user / user</code> или <code>admin / admin</code>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="cabinet-screen" style="display:none;"></div>

<script>
const DEMO_USERS = {
  user: {
    id: 'usr-128', name:'Анна Петрова', email:'user', role:'user', avatar:'А',
    subscription:{ plan:'Про', status:'active', expires:'2026-02-15' },
    lessons:[
      { title:'Регистрация организации', completed:true },
      { title:'Добавление сотрудников', completed:true },
      { title:'Настройка прав доступа', completed:true },
      { title:'Виды ВСД', completed:false },
      { title:'Оформление ВСД на ТН', completed:false },
    ]
  },
  admin:{
    id:'adm-001', name:'Админ', email:'admin', role:'admin', avatar:'А',
    students:[
      { name:'Анна Петрова', plan:'Про', status:'active', progress:'50%' },
      { name:'Иван Сидоров', plan:'Стандарт', status:'trial', progress:'20%' },
      { name:'ООО Агрохим', plan:'Про', status:'expired', progress:'85%' }
    ]
  }
};

const loginScreen = document.getElementById('login-screen');
const cabinetScreen = document.getElementById('cabinet-screen');
const loginForm = document.getElementById('loginForm');

const currentUser = JSON.parse(localStorage.getItem('currentUser'));
if(currentUser) showCabinet(currentUser);

if(loginForm){
  loginForm.addEventListener('submit', e=>{
    e.preventDefault();
    const email=e.target.email.value.trim().toLowerCase();
    const pwd=e.target.password.value.trim().toLowerCase();
    if(DEMO_USERS[email] && pwd===email){
      const user=DEMO_USERS[email];
      localStorage.setItem('currentUser', JSON.stringify(user));
      showCabinet(user);
    } else { alert('Неверный логин/пароль. Попробуйте: user / user или admin / admin'); }
  });
}

function showCabinet(user){
  loginScreen.style.display='none';
  cabinetScreen.style.display='block';

  let html=`<div class="container">
    <header>
      <div class="logo"><div class="mark">М</div><strong>Меркурий без паники</strong></div>
      <div class="user-info">
        <div class="avatar">${user.avatar}</div>
        <div>
          <div>${user.name}</div>
          <div style="font-size:13px;color:var(--muted)">${user.role==='admin'?'Администратор':'Ученик'}</div>
        </div>
        <a href="#" id="logout" style="margin-left:16px;color:var(--muted);text-decoration:underline">Выйти</a>
      </div>
    </header>`;

  if(user.role==='admin'){
    const students=user.students||[];
    html+=`<h2>Панель администратора</h2>
    <div class="card"><p>Всего учеников: <strong>${students.length}</strong></p></div>
    <h3>Ученики</h3>
    <div class="card">
      <table>
        <thead><tr><th>Имя</th><th>Тариф</th><th>Статус</th><th>Прогресс</th></tr></thead>
        <tbody>${students.map(s=>`<tr><td>${s.name}</td><td>${s.plan}</td><td><span class="status ${s.status}">${s.status==='active'?'Активен':s.status==='trial'?'Пробный':'Истёк'}</span></td><td>${s.progress}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  } else {
    const total=user.lessons.length;
    const completed=user.lessons.filter(l=>l.completed).length;
    const percent=Math.round(completed/total*100);
    html+=`<h2>Добро пожаловать, ${user.name}!</h2>
    <div class="card">
      <div><strong>Подписка:</strong> ${user.subscription.plan}</div>
      <div style="margin:8px 0"><span class="badge ${user.subscription.status}">${user.subscription.status==='active'?'Активна':'Истекла'}</span> до ${user.subscription.expires}</div>
      <div>Прогресс: ${completed}/${total} уроков</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
    </div>

    <h3>Уроки</h3>
    <div class="card">
      ${user.lessons.map((l,i)=>`<div class="lesson-item ${l.completed?'completed':''}">
        <span>${l.title}</span>
        ${l.completed?'':`<button class="btn" onclick="completeLesson(${i})">Пройти</button>`}
      </div>`).join('')}
    </div>`;
  }

  html+='</div>';
  cabinetScreen.innerHTML=html;

  document.getElementById('logout').onclick=e=>{
    e.preventDefault();
    localStorage.removeItem('currentUser');
    cabinetScreen.style.display='none';
    loginScreen.style.display='block';
  };
}

function completeLesson(index){
  let user=JSON.parse(localStorage.getItem('currentUser'));
  if(!user || user.role!=='user') return;
  user.lessons[index].completed=true;
  localStorage.setItem('currentUser', JSON.stringify(user));
  showCabinet(user);
}
</script>

</body>
</html>
